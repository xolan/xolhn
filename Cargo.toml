[workspace]
resolver = "2"
members = [
    "crates/xolhn-core",
    "crates/xolhn-ui",
    "crates/xolhn-desktop",
    "crates/xolhn-android",
]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/xolan/xolhn"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ae6a3fdfef416e7040e773415ac9cbd8c623e5d5", default-features = false, features = ["component"] }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "7548ebc4b24f00494af9976af8852c7163ded9ce" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
log = "0.4"
dirs = "6"

# Keep workspace crates fast to compile while optimizing GPUI, wgpu, text shaping,
# layout, JSON, and TLS crates so `dev:desktop` and debug Android builds run smoothly.
[profile.dev.package."*"]
opt-level = 2
